name: Apply SPMB inline verification refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-spmb-inline-verification.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded FormSiswa patch
        run: python .github/scripts/apply_spmb_inline_verification.py

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/apply-spmb-inline-verification.yml
          rm .github/scripts/apply_spmb_inline_verification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/akademik/FormSiswa.tsx .github/workflows/apply-spmb-inline-verification.yml .github/scripts/apply_spmb_inline_verification.py
          git commit -m "feat(spmb): integrate checklist into edit form"
          git push origin main
