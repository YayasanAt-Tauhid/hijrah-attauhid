name: One-time patch pendapatan dimuka UI

on:
  push:
    branches:
      - fix/pendapatan-dimuka-ui
    paths:
      - .github/workflows/patch-pendapatan-dimuka-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pendapatan-dimuka-ui

      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrence(s), found {count}: {old[:120]!r}")
              return text.replace(old, new)

          path = Path("src/hooks/useKeuangan.ts")
          text = path.read_text()
          text = replace_exact(
              text,
              'akun_pendapatan_id, akun_dimuka_id, tipe, tahun_masuk_dari, tahun_masuk_sampai,',
              'akun_pendapatan_id, akun_dimuka_id, perlu_dimuka, tipe, tahun_masuk_dari, tahun_masuk_sampai,',
          )
          text = replace_exact(
              text,
              'akun_dimuka_id?: string | null; tipe?: string;',
              'akun_dimuka_id?: string | null; perlu_dimuka?: boolean; tipe?: string;',
              expected=2,
          )
          path.write_text(text)

          path = Path("src/pages/keuangan/ReferensiKeuangan.tsx")
          text = path.read_text()
          text = replace_exact(
              text,
              '  const [akunDimukaId, setAkunDimukaId] = useState("");\n  const [tipe, setTipe] = useState("bulanan");',
              '  const [akunDimukaId, setAkunDimukaId] = useState("");\n  const [perluDimuka, setPerluDimuka] = useState(true);\n  const [tipe, setTipe] = useState("bulanan");',
          )
          text = replace_exact(
              text,
              'setAkunPendapatanId(""); setAkunDimukaId(""); setTipe("bulanan");',
              'setAkunPendapatanId(""); setAkunDimukaId(""); setPerluDimuka(true); setTipe("bulanan");',
          )
          text = replace_exact(
              text,
              'setAkunPendapatanId(item.akun_pendapatan_id || ""); setAkunDimukaId(item.akun_dimuka_id || ""); setTipe(item.tipe || "bulanan");',
              'setAkunPendapatanId(item.akun_pendapatan_id || ""); setAkunDimukaId(item.akun_dimuka_id || ""); setPerluDimuka(item.perlu_dimuka !== false); setTipe(item.tipe || "bulanan");',
          )
          text = replace_exact(
              text,
              'departemen_id: formDepartemenId || undefined, akun_pendapatan_id: akunPendapatanId || null, akun_dimuka_id: akunDimukaId || null, tipe,',
              'departemen_id: formDepartemenId || undefined, akun_pendapatan_id: akunPendapatanId || null, perlu_dimuka: perluDimuka, akun_dimuka_id: perluDimuka ? (akunDimukaId || null) : null, tipe,',
          )
          text = replace_exact(
              text,
              '        const akun = (r as any).akun_dimuka;\n        if (akun) return <span className="text-sm">{akun.kode} - {akun.nama}</span>;\n        return <span className="text-xs text-muted-foreground">Global</span>;',
              '        if ((r as any).perlu_dimuka === false) return <span className="text-xs text-muted-foreground">Tidak digunakan</span>;\n        const akun = (r as any).akun_dimuka;\n        if (akun) return <span className="text-sm">{akun.kode} - {akun.nama}</span>;\n        return <span className="text-xs text-muted-foreground">Global</span>;',
          )

          pattern = re.compile(
              r'\s{12}<div>\n\s{14}<Label>Akun Pendapatan Dimuka \(untuk pembayaran di muka\)</Label>.*?'
              r'\s{14}<p className="text-xs text-muted-foreground mt-1">Akun liabilitas yang di-kredit saat jenis ini dibayar sebelum tahun ajaran dimulai\. Kosongkan untuk pakai setting AKUN_PENDAPATAN_DIMUKA\.</p>\n'
              r'\s{12}</div>',
              re.S,
          )
          new_block = '''            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <Switch
                  checked={perluDimuka}
                  onCheckedChange={(checked) => {
                    setPerluDimuka(checked);
                    if (!checked) setAkunDimukaId("");
                  }}
                />
                <Label>Gunakan Pendapatan Dimuka</Label>
              </div>
              <p className="text-xs text-muted-foreground">
                Aktifkan hanya jika pembayaran sebelum jatuh tempo belum boleh diakui sebagai pendapatan dan harus dicatat sebagai liabilitas.
              </p>
            </div>
            {perluDimuka ? (
              <div>
                <Label>Akun Pendapatan Dimuka (untuk pembayaran di muka)</Label>
                <Select value={akunDimukaId || "__none__"} onValueChange={(v) => setAkunDimukaId(v === "__none__" ? "" : v)}>
                  <SelectTrigger><SelectValue placeholder="Pilih akun dimuka..." /></SelectTrigger>
                  <SelectContent>
                    <SelectItem value="__none__">— Pakai setting global —</SelectItem>
                    {akunLiabilitasList?.map((a: any) => (
                      <SelectItem key={a.id} value={a.id}>{a.kode} - {a.nama}</SelectItem>
                    ))}
                  </SelectContent>
                </Select>
                <p className="text-xs text-muted-foreground mt-1">Akun liabilitas yang di-kredit saat pembayaran memang harus ditangguhkan. Kosongkan untuk pakai setting AKUN_PENDAPATAN_DIMUKA.</p>
              </div>
            ) : (
              <div className="rounded-md border border-dashed p-3 text-xs text-muted-foreground">
                Akun Pendapatan Dimuka tidak digunakan untuk jenis penerimaan ini. Pembayaran yang belum membentuk piutang akan langsung dikredit ke akun pendapatan di atas.
              </div>
            )}'''
          text, count = pattern.subn(new_block, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected account block once, replaced {count}")
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useKeuangan.ts src/pages/keuangan/ReferensiKeuangan.tsx
          git commit -m "fix(keuangan): make pendapatan dimuka explicit"
          git push origin HEAD:fix/pendapatan-dimuka-ui
