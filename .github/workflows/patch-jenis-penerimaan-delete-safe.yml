name: Patch safe jenis penerimaan delete

on:
  push:
    branches: [fix/jenis-penerimaan-delete-safe]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jenis-penerimaan-delete-safe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hook = Path('src/hooks/useKeuangan.ts')
          text = hook.read_text()
          old = '''export function useDeleteJenisPembayaran() {
            const qc = useQueryClient();
            return useMutation({
              mutationFn: async (id: string) => {
                const { error } = await supabase.from("jenis_pembayaran").delete().eq("id", id);
                if (error) throw error;
              },
              onSuccess: () => {
                qc.invalidateQueries({ queryKey: ["jenis_pembayaran"] });
                toast.success("Jenis pembayaran berhasil dihapus");
              },
              onError: (e: any) => toast.error(e.message),
            });
          }'''
          new = '''export function useDeleteJenisPembayaran() {
            const qc = useQueryClient();
            return useMutation({
              mutationFn: async (id: string): Promise<{ action: "deleted" | "deactivated" }> => {
                const { error } = await supabase.from("jenis_pembayaran").delete().eq("id", id);
                if (!error) return { action: "deleted" };

                // Jenis penerimaan yang sudah dipakai transaksi/tagihan wajib tetap ada
                // agar histori akuntansi tidak kehilangan referensi. FK 23503 adalah
                // sinyal bahwa record sedang direferensikan tabel lain.
                if (error.code !== "23503") throw error;

                const { error: deactivateError } = await supabase
                  .from("jenis_pembayaran")
                  .update({ aktif: false })
                  .eq("id", id);
                if (deactivateError) throw deactivateError;

                return { action: "deactivated" };
              },
              onSuccess: (result) => {
                qc.invalidateQueries({ queryKey: ["jenis_pembayaran"] });
                if (result.action === "deactivated") {
                  toast.warning("Jenis penerimaan sudah digunakan, sehingga tidak dihapus. Statusnya dinonaktifkan agar histori transaksi tetap aman.");
                } else {
                  toast.success("Jenis penerimaan berhasil dihapus");
                }
              },
              onError: (e: any) => toast.error("Gagal memproses jenis penerimaan: " + e.message),
            });
          }'''
          if old not in text:
              raise SystemExit('Target useDeleteJenisPembayaran tidak ditemukan')
          hook.write_text(text.replace(old, new, 1))

          ui = Path('src/pages/keuangan/ReferensiKeuangan.tsx')
          text = ui.read_text()
          old = '<ConfirmDialog open={!!deleteId} onOpenChange={() => setDeleteId(null)} title="Hapus Jenis Penerimaan" description="Yakin ingin menghapus?" onConfirm={() => { if (deleteId) deleteMut.mutate(deleteId); setDeleteId(null); }} />'
          new = '<ConfirmDialog open={!!deleteId} onOpenChange={() => setDeleteId(null)} title="Hapus / Nonaktifkan Jenis Penerimaan" description="Jika belum pernah digunakan, jenis penerimaan akan dihapus. Jika sudah terkait transaksi atau tagihan, data akan dinonaktifkan agar histori keuangan tetap utuh." confirmLabel="Hapus / Nonaktifkan" onConfirm={() => { if (deleteId) deleteMut.mutate(deleteId); setDeleteId(null); }} />'
          if old not in text:
              raise SystemExit('Target ConfirmDialog jenis penerimaan tidak ditemukan')
          ui.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useKeuangan.ts src/pages/keuangan/ReferensiKeuangan.tsx
          git commit -m "fix(keuangan): nonaktifkan jenis penerimaan yang sudah dipakai"
          git push origin HEAD:fix/jenis-penerimaan-delete-safe
