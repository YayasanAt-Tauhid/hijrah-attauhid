name: Deploy to Cloudflare Workers

# Builds the TanStack Start app (Nitro cloudflare-module preset) and deploys
# the Worker. Two apps share this one workflow but point at different
# Supabase projects and different Cloudflare Workers, selected via GitHub
# Environments:
#   - push to `main`  -> environment `production`
#   - push to `staging`  -> environment `staging`
#
# Each environment (Settings -> Environments) must define its own:
#   - CLOUDFLARE_API_TOKEN            [secret] (a token with the "Edit Cloudflare Workers" template)
#   - CLOUDFLARE_ACCOUNT_ID           [secret]
#   - VITE_SUPABASE_URL               [variable] (baked into the client bundle at build time,
#                                       also synced to the Worker as SUPABASE_URL
#                                       runtime secret in the deploy step below; not
#                                       sensitive — publicly visible in the client bundle
#                                       and protected by RLS, not secrecy)
#   - VITE_SUPABASE_PUBLISHABLE_KEY   [variable] (baked into the client bundle at build time;
#                                       use the new sb_publishable_... key, not the
#                                       legacy anon JWT key; also synced to the
#                                       Worker as SUPABASE_ANON_KEY; not sensitive —
#                                       publicly visible in the client bundle and
#                                       protected by RLS, not secrecy)
#   - SUPABASE_SERVICE_ROLE_KEY       [secret] admin key (bypasses RLS, full DB access) —
#                                       synced to the Worker as SUPABASE_SERVICE_ROLE_KEY
#                                       runtime secret in the deploy step below. Protect
#                                       this environment with required reviewers since
#                                       this secret grants full DB access.
#   - MIDTRANS_SERVER_KEY             [secret] server key Midtrans, dipakai server route
#                                       /api/midtrans-notification untuk memverifikasi
#                                       signature webhook. Harus cocok dengan environment
#                                       Midtrans yang dipakai (Sandbox vs Production).
#   - MIDTRANS_CLIENT_KEY             [secret atau variable] client key Midtrans untuk
#                                       memuat Snap.js di halaman checkout. Workflow
#                                       memprioritaskan secret lalu fallback ke variable,
#                                       kemudian menyinkronkannya ke runtime Worker.
#   - WORKER_NAME                     [variable] name of the Cloudflare Worker to deploy to

on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

# Never run two deploys of the same app at once; cancel superseded ones.
# Keyed by branch so production and staging deploys don't cancel each other.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --name "${{ vars.WORKER_NAME }}"

      # Server function (mis. generate tagihan) berjalan di Worker runtime dan
      # membaca env lewat `process.env`, BUKAN lewat bundle client
      # (import.meta.env). Variabel VITE_* di atas hanya di-bake ke bundle
      # client saat build, jadi server function tidak pernah melihatnya
      # kecuali kita salin sebagai secret runtime Worker di sini. Tanpa
      # langkah ini, server function gagal dengan error "SUPABASE_URL belum
      # dikonfigurasi di server" walau VITE_SUPABASE_URL sudah ada di GitHub
      # Environment variables.
      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY || vars.MIDTRANS_CLIENT_KEY }}
        run: |
          echo -n "${{ vars.VITE_SUPABASE_URL }}" | npx --yes wrangler@4 secret put SUPABASE_URL --name "$WORKER_NAME"
          echo -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" | npx --yes wrangler@4 secret put SUPABASE_ANON_KEY --name "$WORKER_NAME"
          echo -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx --yes wrangler@4 secret put SUPABASE_SERVICE_ROLE_KEY --name "$WORKER_NAME"
          # Jangan overwrite secret Midtrans yang sudah ada di Worker dengan
          # string kosong bila GitHub Environment belum dikonfigurasi.
          if [ -n "$MIDTRANS_SERVER_KEY" ]; then
            echo -n "$MIDTRANS_SERVER_KEY" | npx --yes wrangler@4 secret put MIDTRANS_SERVER_KEY --name "$WORKER_NAME"
          else
            echo "MIDTRANS_SERVER_KEY belum diset di GitHub Environment — dilewati (nilai yang sudah ada di Worker dipertahankan)."
          fi
          if [ -n "$MIDTRANS_CLIENT_KEY" ]; then
            echo -n "$MIDTRANS_CLIENT_KEY" | npx --yes wrangler@4 secret put MIDTRANS_CLIENT_KEY --name "$WORKER_NAME"
          else
            echo "MIDTRANS_CLIENT_KEY belum diset di GitHub Environment — dilewati (nilai yang sudah ada di Worker dipertahankan)."
          fi
